name: Deploy Firebase config

on:
  push:
    branches: [main]
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - .github/workflows/firebase-deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify identity (debug)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "FIREBASE_PROJECT_ID secret length: ${#PROJECT_ID}"
          gcloud auth list
          gcloud config get-value project
          node -e "
            const j = JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'));
            console.log('JSON project_id:', j.project_id);
            console.log('JSON client_email:', j.client_email);
          "

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          PROJECT_ID="$(echo -n '${{ secrets.FIREBASE_PROJECT_ID }}' | tr -d '[:space:]')"
          npx firebase deploy --only firestore --non-interactive --project "$PROJECT_ID"

      # Storage rules: not deployed in CI (videos use Cloudflare Stream).
      # npx firebase deploy --only storage --project YOUR_PROJECT_ID

name: Deploy Firebase config

on:
  push:
    branches: [main]
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - .github/workflows/firebase-deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Firestore rules and indexes
        run: >
          npx firebase deploy
          --only firestore
          --non-interactive
          --project "${{ secrets.FIREBASE_PROJECT_ID }}"

      # Storage rules: not deployed in CI (videos use Cloudflare Stream; avatars may move off Firebase Storage).
      # Deploy locally when needed: npx firebase deploy --only storage --project YOUR_PROJECT_ID

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XIIO Sidebar Logo Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #020408;
        font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 12rem;
        flex-shrink: 0;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        background: #02070b;
        display: flex;
        flex-direction: column;
      }
      .logo-link {
        display: flex;
        justify-content: center;
        padding: 1.5rem 1rem 0;
        text-decoration: none;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        font-size: 28px;
        font-weight: 600;
        color: #fff;
        line-height: 1;
      }
      .logo-x {
        position: relative;
        display: inline-flex;
        width: 1em;
        height: 1em;
        align-items: center;
        justify-content: center;
        margin-right: 0.32em;
        flex-shrink: 0;
      }
      .logo-x-bar {
        position: absolute;
        width: 0.1em;
        height: 0.72em;
        border-radius: 9999px;
        background: currentColor;
      }
      .logo-x-bar-a {
        transform: rotate(45deg);
      }
      .logo-x-bar-b {
        transform: rotate(-45deg);
      }
      .logo-ii {
        display: inline-flex;
        align-items: center;
        gap: 0.21em;
        height: 1em;
        flex-shrink: 0;
      }
      .logo-ii-bar {
        width: 0.1em;
        height: 100%;
        background: currentColor;
        border-radius: 9999px;
      }
      .logo-o {
        margin-left: 0.32em;
        width: 1em;
        height: 1em;
        border-radius: 9999px;
        border: 0.1em solid currentColor;
        flex-shrink: 0;
      }
      .main {
        flex: 1;
        padding: 2rem;
        color: rgba(255, 255, 255, 0.45);
        font-size: 0.875rem;
      }
      .hint {
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 0.5rem;
        max-width: 28rem;
        line-height: 1.6;
      }
      code {
        color: #fff;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" aria-label="Sidebar preview">
        <a class="logo-link" href="#" aria-label="XIIO 홈으로">
          <span class="logo">
            <span class="logo-x" aria-hidden="true">
              <span class="logo-x-bar logo-x-bar-a"></span>
              <span class="logo-x-bar logo-x-bar-b"></span>
            </span>
            <span class="logo-ii" aria-hidden="true">
              <span class="logo-ii-bar"></span>
              <span class="logo-ii-bar"></span>
            </span>
            <span class="logo-o" aria-hidden="true"></span>
          </span>
        </a>
      </aside>
      <main class="main">
        <p>사이드바 로고 미리보기 — <code>AppSidebar.tsx</code>와 동일 스타일</p>
        <div class="hint">
          <strong>Cursor에서 보기</strong><br />
          터미널: <code>npm run preview:sidebar</code><br />
          Simple Browser: <code>http://localhost:3456/sidebar-logo.html</code><br />
          전체 앱: <code>npm run dev</code> → <code>http://localhost:3000</code>
        </div>
      </main>
    </div>
  </body>
</html>

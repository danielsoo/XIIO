<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XIIO Sidebar Logo Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #020408;
        font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 12rem;
        flex-shrink: 0;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        background: #02070b;
        display: flex;
        flex-direction: column;
      }
      .logo-link {
        display: flex;
        justify-content: center;
        padding: 1.5rem 1rem 0;
        text-decoration: none;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        font-size: 28px;
        font-weight: 600;
        color: #fff;
        line-height: 1;
        --xiio-cap: calc((0.72em + 0.1em) / sqrt(2));
        /* X↔II, II↔O — XiioWordmark.tsx 의 XIIO_GAP */
        --xiio-gap: 0.74em;
        /* II 두 막대 사이 — XiioWordmark.tsx 의 XIIO_II_GAP */
        --xiio-ii-gap: 0.48em;
      }
      .logo-x {
        position: relative;
        display: inline-flex;
        width: var(--xiio-cap);
        height: var(--xiio-cap);
        align-items: center;
        justify-content: center;
        margin-right: var(--xiio-gap);
        flex-shrink: 0;
        overflow: visible;
      }
      .logo-x-bar {
        position: absolute;
        width: 0.1em;
        /* XIIO_X_ANGLE_DEG=35, sin(45°)/sin(35°) — XiioWordmark.tsx XIIO_X_ARM */
        height: calc(0.72em / 0.76 * 1.23279);
        background: currentColor;
      }
      .logo-x-bar-a {
        transform: rotate(35deg);
        clip-path: polygon(0% 12%, 100% 0%, 100% 88%, 0% 100%);
      }
      .logo-x-bar-b {
        transform: rotate(-35deg);
        clip-path: polygon(0% 0%, 100% 12%, 100% 100%, 0% 88%);
      }
      .logo-ii {
        display: inline-flex;
        align-items: center;
        gap: var(--xiio-ii-gap);
        height: var(--xiio-cap);
        flex-shrink: 0;
      }
      .logo-ii-bar {
        width: 0.1em;
        height: 100%;
        background: currentColor;
      }
      .logo-o {
        margin-left: var(--xiio-gap);
        /* XiioWordmark.tsx XIIO_O_SIZE — II cap + 0.1em */
        width: calc(var(--xiio-cap) + 0.1em);
        height: calc(var(--xiio-cap) + 0.1em);
        border-radius: 9999px;
        border: 0.1em solid currentColor;
        flex-shrink: 0;
      }
      .main {
        flex: 1;
        padding: 2rem;
        color: rgba(255, 255, 255, 0.45);
        font-size: 0.875rem;
      }
      .hint {
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 0.5rem;
        max-width: 28rem;
        line-height: 1.6;
      }
      code {
        color: #fff;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" aria-label="Sidebar preview">
        <a class="logo-link" href="#" aria-label="XIIO 홈으로">
          <span class="logo">
            <span class="logo-x" aria-hidden="true">
              <span class="logo-x-bar logo-x-bar-a"></span>
              <span class="logo-x-bar logo-x-bar-b"></span>
            </span>
            <span class="logo-ii" aria-hidden="true">
              <span class="logo-ii-bar"></span>
              <span class="logo-ii-bar"></span>
            </span>
            <span class="logo-o" aria-hidden="true"></span>
          </span>
        </a>
      </aside>
      <main class="main">
        <p>사이드바 로고 미리보기 — <code>--xiio-gap</code>(그룹), <code>--xiio-ii-gap</code>(II 내부)</p>
        <div class="hint">
          <strong>실제 앱</strong><br />
          <code>npm run dev</code> → <code>XiioWordmark.tsx</code>의
          <code>XIIO_GAP</code>, <code>XIIO_II_GAP</code> 사용<br /><br />
          <strong>이 미리보기만</strong><br />
          터미널: <code>npm run preview:sidebar</code><br />
          브라우저: <code>http://localhost:3456/sidebar-logo.html</code> (저장 후 새로고침)
        </div>
      </main>
    </div>
  </body>
</html>
